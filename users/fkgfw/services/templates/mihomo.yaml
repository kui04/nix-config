# A template for mihomo client config
# The actual config is output by users/fkgfw/gen.sh
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true

geodata-mode: true

geox-url: 
  geoip:  "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country.mmdb"

geo-auto-update: true
geo-update-interval: 24

global-client-fingerprint: chrome
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: 
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "*.test"
    - localhost.ptlogin2.qq.com
    - "+.msftconnecttest.com"
    # 以下域名返回真实 IP,避免 fake-ip 干扰连通性检测、NTP 对时、STUN 通话
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.pool.ntp.org"
    - "+.ntp.org.cn"
    - "+.market.xiaomi.com"
    - "stun.*.*"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
  default-nameserver: 
    - 223.5.5.5
    - 119.29.29.29
  nameserver: 
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "geosite:cn,private": 
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

proxies:
  - name: "hysteria2"
    type: hysteria2
    server: SERVER_IP_OR_DOMAIN
    port: 443
    ports: 20000-50000
    password: "HY2_PASSWORD"
    sni: www.bing.com
    skip-cert-verify: false
    fingerprint: FINGERPRINT
    fast-open: true

  - name: "vless-reality-vision"
    type: vless
    server: SERVER_IP_OR_DOMAIN
    port: 443
    uuid: "VLESS_UUID"
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: www.bing.com
    client-fingerprint: chrome
    packet-encoding: xudp
    skip-cert-verify: true
    reality-opts:
      public-key: "VLESS_PUBLIC_KEY"
      short-id: ""

proxy-groups:
  - name: "Proxy"
    type: select
    proxies:
      - vless-reality-vision
      - hysteria2
      - DIRECT

rules:
  # 广告屏蔽
  - GEOSITE,category-ads-all,REJECT

  # 私有网络直连
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  # 在国内有接入点的服务 CDN 直连,不消耗服务器流量;
  # 带 @cn 属性的规则必须放在 GEOSITE,geolocation-!cn 之前才会生效
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,google-play@cn,DIRECT

  # Google 系全部走代理,必须位于 GEOSITE,cn 之前 ——
  # geosite:cn 含有 dl.google.com、clientservices.googleapis.com 等条目,
  # 并通过 tld-cn 直连全部 .cn 域名(googleapis.cn、google.cn 等)
  - GEOSITE,google,Proxy

  # 非中国域名走代理(包含 GFW 列表)
  - GEOSITE,geolocation-!cn,Proxy

  # 中国大陆域名直连
  - GEOSITE,cn,DIRECT

  # 其余域名解析出真实 IP 后按归属直连;不能加 no-resolve,
  # 否则带域名的连接会跳过此规则,漏网的国内域名会被误代理
  - GEOIP,cn,DIRECT

  # 兜底规则
  - MATCH,Proxy
